server {
    server_name robertmesa.es www.robertmesa.es;

    root /var/www/danza;
    index index.html;

    # Optimización Gzip integrada correctamente
    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript image/svg+xml;
    gzip_disable "MSIE [1-6]\.";

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Caché estática para assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # SSL / TLS parametrizado por Certbot
    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/robertmesa.es/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/robertmesa.es/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    include /etc/nginx/snippets/security-headers.conf;
    server_tokens off;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# Redirección de HTTP (80) a HTTPS (443)
server {
    if ($host = www.robertmesa.es) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = robertmesa.es) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;

    server_name robertmesa.es www.robertmesa.es;
    return 404; # managed by Certbot
}